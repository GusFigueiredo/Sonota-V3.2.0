<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sonota • Acesso</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="backend.css"></head>
<body class="auth-page"><main class="auth-card"><a class="auth-brand" href="login.html"><img class="auth-brand-logo" src="assets/sonota-logo-name.png" alt="Sonota"></a><div class="eyebrow">Seu acervo. Seu próximo som.</div><h1 id="authTitle">Entre no seu estúdio</h1><p>Organize sons, clientes e projetos em um só lugar.</p>
<form id="authForm"><div class="form-grid"><div class="form-group full register-only hidden"><label for="name">Seu nome</label><input id="name" autocomplete="name" maxlength="160"></div><div class="form-group full register-only hidden"><label for="studio">Estúdio ou empresa</label><input id="studio" autocomplete="organization" maxlength="300"></div><div class="form-group full"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" maxlength="254" required></div><div class="form-group full"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" maxlength="128" required><small id="passwordHelp" class="register-only hidden">Use pelo menos 6 caracteres e inclua ao menos 1 número.</small></div></div><p class="form-error" id="authError" role="alert"></p><button class="primary-btn" id="authSubmit" type="submit">Entrar</button></form>
<button class="ghost-btn" id="authToggle" type="button">Ainda não tenho conta</button><p class="auth-note">Cada conta possui seus próprios arquivos e projetos.</p></main><script src="api.js"></script><script src="login.js"></script></body></html>
